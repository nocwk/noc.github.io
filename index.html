<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blank Screen</title>
  <style>
    /* Reset margins, paddings, and ensure full viewport coverage without scrollbars */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      min-height: 100%;
      background-color: #000000;
      overflow: hidden; /* Eliminates scrollbars */
      user-select: none; /* Prevents text cursor/selection highlights */
    }
  </style>
</head>
<body>
</body>
</html>
